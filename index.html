<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>首頁 - 抹茶手搖專賣店</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-green: #2d4a3e;
            --accent-green: #4a7c59;
            --light-green: #eef4f0;
            --cream-bg: #faf8f5;
            --text-dark: #2c302e;
            --text-muted: #5c6360;
            --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', 'Noto Serif TC', serif, sans-serif;
            background-color: var(--cream-bg);
            color: var(--text-dark);
            line-height: 1.8;
        }

        /* 導覽列 */
        nav {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 1.2rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 15px rgba(0,0,0,0.04);
            display: flex;
            justify-content: center;
            gap: 2rem;
        }

        nav a {
            color: var(--primary-green);
            text-decoration: none;
            font-weight: 600;
            font-size: 1.05rem;
            padding: 0.4rem 1rem;
            border-radius: 20px;
            transition: all 0.3s ease;
        }

        nav a:hover, nav a.active {
            background-color: var(--primary-green);
            color: #fff;
        }

        /* 主容器 */
        .container {
            max-width: 1080px;
            margin: 0 auto;
            padding: 2.5rem 1.5rem;
        }

        /* 主橫幅 Hero Section */
        .hero {
            background: #fff;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: var(--card-shadow);
            margin-bottom: 3rem;
            display: grid;
            grid-template-columns: 1fr 1fr;
            align-items: center;
        }

        .hero-img-wrapper {
            height: 100%;
            min-height: 380px;
        }

        .hero-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .hero-content {
            padding: 3rem;
        }

        .hero-content h1 {
            color: var(--primary-green);
            font-size: 2.2rem;
            margin-bottom: 1rem;
            font-weight: 700;
        }

        .hero-content p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        /* 區塊標題 */
        .section-title {
            font-size: 1.8rem;
            color: var(--primary-green);
            margin-bottom: 1.5rem;
            position: relative;
            padding-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .section-title::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 50px;
            height: 3px;
            background-color: var(--accent-green);
            border-radius: 2px;
        }

        /* 優惠區塊卡片 */
        .promo-card {
            background: var(--light-green);
            border-left: 5px solid var(--accent-green);
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 3.5rem;
        }

        .promo-list {
            list-style: none;
        }

        .promo-list li {
            position: relative;
            padding-left: 1.8rem;
            margin-bottom: 1rem;
            font-size: 1.05rem;
        }

        .promo-list li:last-child {
            margin-bottom: 0;
        }

        .promo-list li::before {
            content: "🍃";
            position: absolute;
            left: 0;
            top: 0;
        }

        /* 商品排行榜網格 */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            margin-bottom: 3.5rem;
        }

        .product-card {
            background: #fff;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: var(--card-shadow);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
        }

        .product-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
        }

        .badge {
            position: absolute;
            top: 15px;
            left: 15px;
            background: var(--primary-green);
            color: #fff;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            z-index: 2;
        }

        .product-card img {
            width: 100%;
            height: 240px;
            object-fit: cover;
            display: block;
        }

        .product-info {
            padding: 1.5rem;
        }

        .product-info h3 {
            color: var(--primary-green);
            font-size: 1.3rem;
            margin-bottom: 0.6rem;
        }

        .product-info p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* 最新消息 */
        .news-box {
            background: #fff;
            border-radius: 16px;
            padding: 1.8rem 2rem;
            box-shadow: var(--card-shadow);
            border: 1px solid #e2ebd8;
        }

        /* 響應式手機微調 */
        @media (max-width: 768px) {
            .hero {
                grid-template-columns: 1fr;
            }
            .hero-img-wrapper {
                min-height: 250px;
            }
            .hero-content {
                padding: 2rem 1.5rem;
            }
        }
    </style>
</head>
