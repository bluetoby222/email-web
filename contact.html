<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聯絡我們 - 抹茶手搖專賣店</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-green: #2d4a3e;
            --accent-green: #4a7c59;
            --light-green: #eef4f0;
            --cream-bg: #faf8f5;
            --text-dark: #2c302e;
            --text-muted: #5c6360;
            --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', 'Noto Serif TC', serif, sans-serif;
            background-color: var(--cream-bg);
            color: var(--text-dark);
            line-height: 1.8;
        }

        nav {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 1.2rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 15px rgba(0,0,0,0.04);
            display: flex;
            justify-content: center;
            gap: 2rem;
        }

        nav a {
            color: var(--primary-green);
            text-decoration: none;
            font-weight: 600;
            font-size: 1.05rem;
            padding: 0.4rem 1rem;
            border-radius: 20px;
            transition: all 0.3s ease;
        }

        nav a:hover, nav a.active {
            background-color: var(--primary-green);
            color: #fff;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 2.5rem 1.5rem;
        }

        .contact-wrapper {
            background: #fff;
            border-radius: 24px;
            box-shadow: var(--card-shadow);
            overflow: hidden;
            display: grid;
            grid-template-columns: 1fr 1.2fr;
        }

        .contact-img {
            height: 100%;
            min-height: 350px;
        }

        .contact-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .form-section {
            padding: 2.5rem;
        }

        .form-section h1 {
            color: var(--primary-green);
            font-size: 1.8rem;
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.4rem;
            font-weight: 600;
            color: var(--primary-green);
            font-size: 0.95rem;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 1.5px solid #e2e8e4;
            border-radius: 10px;
            font-size: 1rem;
            font-family: inherit;
            transition: border-color 0.3s ease;
            outline: none;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: var(--accent-green);
        }

        .submit-btn {
            width: 100%;
            background: var(--primary-green);
            color: #fff;
            border: none;
            padding: 0.9rem;
            font-size: 1.05rem;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .submit-btn:hover {
            background: var(--accent-green);
        }

        @media (max-width: 768px) {
            .contact-wrapper {
                grid-template-columns: 1fr;
            }
            .contact-img {
                height: 200px;
                min-height: auto;
            }
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html">首頁</a>
        <a href="about.html">公司介紹</a>
        <a href="contact.html" class="active">聯絡我們</a>
    </nav>

    <div class="container">
        <div class="contact-wrapper">
            <div class="contact-img">
                <img src="Contact_us.jpg" alt="聯絡我們情境圖">
            </div>
            
            <div class="form-section">
                <h1>聯絡我們</h1>
                <form action="https://formspree.io/f/mdeedonv" method="POST">
                    <div class="form-group">
                        <label>姓名</label>
                        <input type="text" name="姓名" placeholder="請輸入姓名" required>
                    </div>
                    <div class="form-group">
                        <label>電話</label>
                        <input type="tel" name="電話" placeholder="例如：0912345678" required>
                    </div>
                    <div class="form-group">
                        <label>EMAIL</label>
                        <input type="email" name="Email" placeholder="your@email.com" required>
                    </div>
                    <div class="form-group">
                        <label>聯絡內容</label>
                        <textarea name="聯絡內容" rows="4" placeholder="請寫下您的建議或問題..." required></textarea>
                    </div>
                    <button type="submit" class="submit-btn">送出表單</button>
                </form>
            </div>
        </div>
    </div>

</body>
</html>
