    <h1>聯絡我們</h1>
    
    <!-- 先用預設表單格式 -->
    <form action="https://formspree.io/f/YOUR_FORMSPREE_ID" method="POST">
        <div>
            <label>姓名：</label><br>
            <input type="text" name="姓名" required>
        </div>
        <br>
        <div>
            <label>電話：</label><br>
            <input type="tel" name="電話" required>
        </div>
        <br>
        <div>
            <label>EMAIL：</label><br>
            <input type="email" name="Email" required>
        </div>
        <br>
        <div>
            <label>聯絡內容：</label><br>
            <textarea name="聯絡內容" rows="5" required></textarea>
        </div>
        <br>
        <button type="submit">送出表單</button>
    </form>
</body>
</html>
